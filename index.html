
<!DOCTYPE html>
<html lang="en">
  

<head>
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome | DCS UBIT Alumni Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="CSS/landing.css">
</head>
<body class="landing">

<header class="lp-header">
  <a class="lp-brand" href="index.html">
    <img class="lp-brand-logo" src="assets/logo.PNG" alt="DCS UBIT logo">
    <span class="lp-brand-text">
      <span class="lp-brand-name">Alumni Portal</span>
      <span class="lp-brand-tag">Stay connected. Stay inspired.</span>
    </span>
  </a>

  <p class="lp-affil">Department of Computer Science<br>University of Karachi</p>
</header>

  <main class="lp-hero">

    <div class="lp-photo" aria-hidden="true"></div>
    <div class="lp-dots" aria-hidden="true"></div>
    <svg class="lp-lines" viewBox="0 0 400 400" aria-hidden="true">
      <polyline points="0,400 150,200 300,400" fill="none" stroke="currentColor" stroke-width="1"/>
    </svg>

    <section class="lp-content">
      
      <h1 class="lp-title">A Legacy<br>That Connects.</h1>
      <span class="lp-rule" aria-hidden="true"></span>
      <p class="lp-sub">Reuniting minds. Building futures.<br>Strengthening our community.</p>

      <div class="lp-row">
        <div class="lp-actions">
          <a class="lp-btn lp-btn-main" href="PAGES/register.html">Create account</a>
          <a class="lp-btn lp-btn-ghost" href="PAGES/login.html">Login</a>
        </div>

        <figure class="lp-quote">
          <blockquote id="quoteText">Once a UBITian, always a UBITian. This portal is how we stay in touch.</blockquote>
        </figure>
      </div>
    </section>

    <div class="lp-badge" aria-hidden="true">
      <svg class="lp-badge-ring" viewBox="0 0 200 200">
        <defs>
          <path id="badgeCircle" d="M100,100 m-76,0 a76,76 0 1,1 152,0 a76,76 0 1,1 -152,0"/>
        </defs>
        <text>
          <textPath href="#badgeCircle" startOffset="0" textLength="470">OUR PAST • YOUR FUTURE • ONCE A UBITIAN •</textPath>
        </text>
      </svg>
      <img class="lp-badge-logo" src="assets/logo.PNG" alt="">
    </div>

    <div class="lp-scroll" aria-hidden="true">
      <span class="lp-mouse"><span class="lp-mouse-dot"></span></span>
      <span class="lp-scroll-text">Scroll to explore</span>
    </div>
  </main>

  <script src="JS/landing.js" defer></script>
</body>
</html>
