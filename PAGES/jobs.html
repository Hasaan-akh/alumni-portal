<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs</title>
  <link rel="stylesheet" href="../CSS/jobs.css">
</head>
<body>
  <nav>
    <a href="directory.html">Directory</a>
    <a href="my-profile.html">My profile</a>
    <a href="admin.html" id="adminLink" hidden>Admin</a>
    <button onclick="logout()">Logout</button>
  </nav>

  <h1>Jobs</h1>

  <h2>Explore jobs</h2>
  <form id="filterForm">
    <input id="f_keyword" placeholder="Title, company or skill">
    <select id="f_type">
      <option value="">Any type</option>
      <option value="full-time">Full-time</option>
      <option value="part-time">Part-time</option>
      <option value="internship">Internship</option>
      <option value="contract">Contract</option>
    </select>
    <input id="f_location" placeholder="Location">
    <button type="submit">Search</button>
    <button type="button" id="clearBtn">Clear</button>
  </form>
  <p id="status"></p>
  <div id="jobList"></div>
  <button id="moreBtn" hidden>Load more</button>

  <h2>Post a job</h2>
  <p id="postMessage"></p>
  <form id="postForm">
    <input id="j_title" placeholder="Job title" required>
    <input id="j_company" placeholder="Company" required>
    <input id="j_experience" placeholder="Experience required (e.g. 2 years)" required>
    <select id="j_type">
      <option value="">Job type (optional)</option>
      <option value="full-time">Full-time</option>
      <option value="part-time">Part-time</option>
      <option value="internship">Internship</option>
      <option value="contract">Contract</option>
    </select>
    <input id="j_location" placeholder="Location (optional)">
    <input id="j_skills" placeholder="Skills (optional, comma separated)">
    <textarea id="j_description" maxlength="3000" placeholder="Description (optional)"></textarea>
    <input id="j_email" type="email" placeholder="Email to send CV to">
    <input id="j_link" placeholder="Or application link (https://...)">
    <p>Give an email, a link, or both.</p>
    <button type="submit" id="postBtn">Post job</button>
  </form>

  <h2>My listings</h2>
  <p id="myStatus"></p>
  <div id="myJobs"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../JS/config.js"></script>
  <script src="../JS/auth.js"></script>
  <script src="../JS/jobs.js"></script>
</body>
</html>
