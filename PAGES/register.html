<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account</title>
</head>
<body>
  <h1>Create account</h1>
  <p id="message"></p>

  <form id="registerForm">
    <input id="full_name" placeholder="Full name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password (min 8 characters)" required>
    <input id="confirm_password" type="password" placeholder="Confirm password" required>
    <input id="batch" placeholder="Batch" required>
    <input id="graduation_year" type="number" placeholder="Graduation year" required>
    <input id="enrollment_no" placeholder="Enrollment number" required>
    <button type="submit" id="submitBtn">Create account</button>
  </form>

  <p>Already have an account? <a href="login.html">Login</a></p>
  <a href="../index.html">Home</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
