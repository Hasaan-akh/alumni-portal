<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email</title>
</head>
<body>
  <h1>Confirm your email</h1>
  <p>We sent a code to your email. Enter it below. Check your spam folder if you can't find it.</p>
  <p id="message"></p>

  <form id="verifyForm">
    <input id="email" type="email" placeholder="Email" required>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code from email" required>
    <button type="submit" id="submitBtn">Confirm</button>
  </form>
  <button type="button" id="resendBtn">Resend code</button>

  <p><a href="login.html">Back to login</a></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/verify-email.js"></script>
</body>
</html>
