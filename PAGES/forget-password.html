<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password</title>
</head>
<body>
  <h1>Forgot password</h1>
  <p id="message"></p>

  <form id="emailForm">
    <input id="email" type="email" placeholder="Your email" required>
    <button type="submit" id="sendBtn">Send code</button>
  </form>

  <form id="resetForm" hidden>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Code from email" required>
    <input id="new_password" type="password" placeholder="New password (min 8 characters)" required>
    <input id="confirm_password" type="password" placeholder="Confirm new password" required>
    <button type="submit" id="resetBtn">Change password</button>
  </form>

  <p><a href="login.html">Back to login</a></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/forgot-password.js"></script>
</body>
</html>
