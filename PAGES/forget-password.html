<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forgot Password | DCS UBIT Alumni Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../CSS/auth-base.css">
  <link rel="stylesheet" href="../CSS/auth-simple.css">
</head>
<body class="auth-page simple-page photo-day">

  <header class="site-header">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/logo.png" alt="DCS UBIT logo">
      <span class="brand-text">
        <span class="brand-dept">Department of Computer Science</span>
        <span class="brand-uni">University of Karachi</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="../index.html">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
        Home
      </a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="simple-photo" aria-hidden="true"></div>
    <div class="simple-glow" aria-hidden="true"></div>
    <svg class="simple-ribbon" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="sr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a1230"/><stop offset=".5" stop-color="#4a0b1d"/><stop offset="1" stop-color="#2a0610" stop-opacity=".3"/></linearGradient></defs>
      <path d="M0 140 C 260 160 520 250 820 262 C 1100 272 1300 230 1440 190 L1440 300 L0 300Z" fill="url(#sr)" opacity=".85"/>
      <path d="M0 140 C 260 160 520 250 820 262 C 1100 272 1300 230 1440 190" fill="none" stroke="#d6ad65" stroke-width="2.5" stroke-opacity=".8"/>
    </svg>

    <div class="auth-card">
      <div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg></div>
      <h2>Forgot Password?</h2>
      <p class="sub">Enter your email and we will send you a code to reset your password.</p>

      <p id="message" role="alert"></p>

      <!-- IDs below are used by forget-password.js — do not rename -->
      <form id="emailForm">
        <div class="field">
          <label for="email">Email Address</label>
          <div class="control">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required>
          </div>
        </div>
        <button type="submit" id="sendBtn" class="btn-primary">Send Code <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>

      <form id="resetForm" hidden>
        <div class="field">
          <label for="code">Code from Email</label>
          <input id="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Enter the code" required>
        </div>
        <div class="field">
          <label for="new_password">New Password</label>
          <div class="control">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="new_password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" required>
            <button type="button" class="toggle-pw" data-target="new_password" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm New Password</label>
          <div class="control">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="confirm_password" type="password" placeholder="Re-enter new password" autocomplete="new-password" required>
            <button type="button" class="toggle-pw" data-target="confirm_password" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
          </div>
        </div>
        <button type="submit" id="resetBtn" class="btn-primary">Change Password <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>

      <a class="back-link" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Back to Login</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/forget-password.js"></script>

  <script>
    document.querySelectorAll(".toggle-pw").forEach(function (btn) {
      var input = document.getElementById(btn.dataset.target);
      var slash = btn.querySelector(".slash");
      slash.style.display = "none";
      btn.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        slash.style.display = show ? "" : "none";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });
  </script>
</body>
</html>
